# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-datadog"
BBFILE_PATTERN_meta-datadog = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-datadog = "6"

LAYERDEPENDS_meta-datadog = "core"
LAYERSERIES_COMPAT_meta-datadog = "scarthgap walnascar"
